<div class="choose-side">
  <img class="choose-side__bg" [src]="backgroundImage" alt="" />
  <div class="choose-side__scrim"></div>

  <header class="choose-side__heading">
    <p class="choose-side__eyebrow"><span></span> Strategic campaign · 01 / 02</p>
    <h1 class="choose-side__title">Choose your alliance</h1>
    <p class="choose-side__subtitle">Decide whom you will lead in the fight for the future of the world.</p>
  </header>

  <div class="choose-side__halves">
    <button
      type="button"
      class="choose-side__half choose-side__half--west"
      [class.choose-side__half--selected]="selectedSide() === 'west'"
      [class.choose-side__half--dimmed]="selectedSide() === 'east'"
      [attr.aria-pressed]="selectedSide() === 'west'"
      (click)="selectSide('west')"
    >
      <span class="choose-side__label">
        <span class="choose-side__block choose-side__block--west">Western bloc</span>
        <span class="choose-side__name">Western Allies</span>
        <span class="choose-side__members">EUTO · USA · SEATO</span>
        <span class="choose-side__select">
          {{ selectedSide() === 'west' ? 'Alliance selected' : 'Select alliance' }}
          <span aria-hidden="true">→</span>
        </span>
      </span>
    </button>

    <button
      type="button"
      class="choose-side__half choose-side__half--east"
      [class.choose-side__half--selected]="selectedSide() === 'east'"
      [class.choose-side__half--dimmed]="selectedSide() === 'west'"
      [attr.aria-pressed]="selectedSide() === 'east'"
      (click)="selectSide('east')"
    >
      <span class="choose-side__label">
        <span class="choose-side__block choose-side__block--east">Eastern bloc</span>
        <span class="choose-side__name">Eurasian Pact</span>
        <span class="choose-side__members">Russia · China · Arabia League</span>
        <span class="choose-side__select">
          {{ selectedSide() === 'east' ? 'Alliance selected' : 'Select alliance' }}
          <span aria-hidden="true">→</span>
        </span>
      </span>
    </button>
  </div>

  @if (selectedSide()) {
    <button type="button" class="choose-side__continue" (click)="continue()">
      <span>Continue</span>
      <span aria-hidden="true">→</span>
    </button>
  }
</div>
