@if (interactive()) {
  <button
    type="button"
    class="combat-board__unit"
    [class.combat-board__unit--clickable]="clickable()"
    [class.combat-board__unit--fx-hit]="outcomeFx() === 'hit'"
    [class.combat-board__unit--fx-miss]="outcomeFx() === 'miss'"
    [disabled]="!clickable()"
    [title]="unitName()"
    (click)="unitClick.emit()"
  >
    <wwiii-unit-icon [unitId]="unitId()" [ownerId]="ownerId()" [color]="color()" [size]="size()" />
    @if (rollInfo(); as roll) {
      <span
        class="combat-board__roll"
        [class.combat-board__roll--hit]="!rolling() && roll.hit"
        [class.combat-board__roll--rolling]="rolling()"
        [class.combat-board__roll--pop]="rollJustLanded()"
        >{{ rolling() ? shownValue() : roll.roll }}</span
      >
    }
    @if (outcomeFx() === 'hit') {
      <span class="combat-board__burst" aria-hidden="true"></span>
    } @else if (outcomeFx() === 'miss') {
      <span class="combat-board__miss-mark" aria-hidden="true">✕</span>
    }
  </button>
} @else if (armed()) {
  <span class="combat-board__unit combat-board__unit--armed-missile" [title]="unitName()">
    <wwiii-unit-icon [unitId]="unitId()" [ownerId]="ownerId()" [color]="color()" [size]="size()" />
  </span>
} @else {
  <span class="combat-board__casualty" [title]="unitName() + ' (casualty)'">
    <wwiii-unit-icon [unitId]="unitId()" [ownerId]="ownerId()" [color]="color()" [size]="size()" />
    @if (rollInfo(); as roll) {
      <span
        class="combat-board__roll"
        [class.combat-board__roll--hit]="!rolling() && roll.hit"
        [class.combat-board__roll--rolling]="rolling()"
        [class.combat-board__roll--pop]="rollJustLanded()"
        >{{ rolling() ? shownValue() : roll.roll }}</span
      >
    }
  </span>
}
